services:
  intern-app:
    image: intern-app:local
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      FLASK_ENV: prod
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY dans Portainer}
    volumes:
      - uploads:/intern-app/uploads
      - generated:/intern-app/generated

volumes:
  uploads:
  generated:
