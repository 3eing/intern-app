services:
  intern-app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      FLASK_ENV: prod
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY dans le fichier .env}
    volumes:
      - uploads:/intern-app/apps/uploads
      - generated:/intern-app/apps/generated

volumes:
  uploads:
  generated:
